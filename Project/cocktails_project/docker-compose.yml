services:
  web:
    build: .
    volumes:
      - .:/app:cached
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=cocktails_project.settings
      - DEBUG=1
    command: bash -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
