{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Cocktails</title>

    <link rel="stylesheet" href="{% static 'admin/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'admin/css/forms.css' %}">

    <style>
.container {
    max-width: 800px;
    margin: auto;
}

.card {
    background: white;
    padding: 15px;
    margin: 20px 0;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.card-image {
    margin-bottom: 12px;
}

.card-image img {
    width: 100%;
    max-height: 240px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
}

.card .card-title {
    margin: 0 0 8px;
    padding: 0;
    font-size: 1.35rem;
    font-weight: 600;
    line-height: 1.3;
    color: #1a1a1a;
}

.card .card-meta {
    margin: 0 0 14px;
    color: #555;
}

.card .card-section {
    margin: 0 0 6px;
    font-size: 1rem;
    font-weight: 600;
    color: #333;
}

.card .card-excerpt {
    margin: 0 0 12px;
    font-size: 0.95rem;
    line-height: 1.5;
    color: #444;
}

.card .card-more {
    margin: 4px 0 0;
    font-size: 0.9rem;
    color: #417690;
    font-weight: 600;
}

.card-link {
    text-decoration: none;
    color: inherit;
    display: block;
}

.card-link:hover .card {
    box-shadow: 0 0 16px rgba(0,0,0,0.15);
}

#branding h1 a {
    color: inherit !important;
    text-decoration: none !important;
    cursor: pointer;
}

#branding h1 a:hover {
    text-decoration: none !important;
    color: inherit !important;
}

</style>
{% block extra_head %}{% endblock %}
</head>

<body class="app-recipes">

<div id="header">
    <div id="branding">
        <h1><a href="{% url 'recipe_list' %}">Cocktail App</a></h1>
    </div>

 <div style="margin-top:10px;">
        <form method="get" action="/">
            <input type="text" name="q" placeholder="Search recipes..." value="{{ request.GET.q }}">
            <button type="submit">Search</button>
        </form>
    </div>

    <div id="user-tools">
        {% if user.is_authenticated %}
        Hello, {{ user.username }}!
    <form method="post" action="/accounts/logout/" style="display:inline;">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
        {% else %}
            <a href="/accounts/login/">Login</a> |
            <a href="/register/">Register</a>
        {% endif %}
    </div>
</div>

<div id="content">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
